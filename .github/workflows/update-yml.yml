name: Update YML from T-Bank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "menu.yml"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bootstrap menu.yml if missing
        run: |
          if [ ! -f menu.yml ]; then
            base64 -d seed_menu.yml.gz.b64 | gzip -d > menu.yml
          fi
      - name: Build menu.yml from uantonio.tb.ru
        run: python scrape_tb_to_yml.py
      - name: Commit changed feed
        run: |
          if [ -z "$(git status --porcelain -- menu.yml)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "u-antonio-yml-bot"
          git config user.email "actions@users.noreply.github.com"
          git add menu.yml
          git commit -m "Update YML feed"
          git push
